<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>המשחק הכי גרוע בעולם — עם באגים</title>
<style>
  html,body{height:100%;margin:0;padding:0;font-family:'Courier New',monospace;cursor:none;overflow:hidden}
  body{animation:annoyingColors 2s infinite alternate linear;}
  @keyframes annoyingColors{
    0%{background-color:#ff0000;}
    10%{background-color:#00ff00;}
    20%{background-color:#0000ff;}
    30%{background-color:#ffff00;}
    40%{background-color:#ff00ff;}
    50%{background-color:#00ffff;}
    60%{background-color:#ff8800;}
    70%{background-color:#8800ff;}
    80%{background-color:#00ff88;}
    90%{background-color:#ff0088;}
    100%{background-color:#ffffff;}
  }
  #gameWrap{width:640px;height:480px;margin:20px auto;padding:10px;border:10px dashed #ff00ff;background:rgba(255,255,255,0.1);box-shadow:0 0 0 8px rgba(0,0,0,0.3);transition:width 0.4s ease,height 0.4s ease,transform 0.4s ease;}
  canvas{background:#111;border:6px solid #ff0000;display:block;margin:0 auto;transition:transform 0.3s ease;}
  .ui{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .btn{padding:6px 12px;border:3px groove #000;background:linear-gradient(#fff,#ccc);cursor:pointer}
  .btn[disabled]{opacity:0.4;cursor:not-allowed}
  .annoy{font-size:12px;color:#fff;background:#000;padding:4px;border:2px solid #ff0}
  @keyframes blink {0%{opacity:1}50%{opacity:0.2}100%{opacity:1}}
  h1{animation:blink 0.3s infinite,annoyHue 1s infinite linear;background:linear-gradient(90deg,red,green,blue,yellow,pink,orange);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;font-size:24px;}
  @keyframes annoyHue {from {filter:hue-rotate(0deg);} to {filter:hue-rotate(360deg);} }
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:#111;color:#fff;padding:8px 12px;border-radius:6px;border:2px solid #f0f;display:none;font-family:monospace}
  #cursorEmoji{position:fixed;font-size:30px;pointer-events:none;z-index:9999;mix-blend-mode:difference;transform:translate(-50%,-50%);}
  #cursorEmoji img{width:36px;height:36px;display:block;}
</style>
</head>
<body>
  <div id="gameWrap">
    <h1>המשחק הכי גרוע בעולם</h1>
    <canvas id="c" width="480" height="320"></canvas>
    <div class="ui">
      <button id="spawnbtn" class="btn">צור חיית מחמד</button>
      <button id="sellbtn" class="btn">מכור חיית מחמד</button>
      <button id="trashbtn" class="btn">לחץ אותי!</button>
    </div>
    <div class="annoy" id="ann">מטבעות: 0 • חיות: 0</div>
  </div>
  <div id="toast"></div>

  <!-- כאן העכבר החדש -->
  <div id="cursorEmoji" aria-hidden="true">
    <img id="cursorImg" src="http://photos.com/mouse.jpg" alt="cursor">
  </div>

<script>
// באגים מכוונים – כמו שהיה
let coins=0;let pets=[];let tick=0;let clickCount=0;
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
const gameWrap=document.getElementById('gameWrap');

let targetX=0,targetY=0;let currentX=0,currentY=0;

// --- קוד הסמן החדש ---
const cursorEl=document.getElementById('cursorEmoji');
const cursorImg=document.getElementById('cursorImg');

cursorImg.onerror = function(){
  cursorEl.innerText='🖱️';
  cursorEl.style.fontSize='30px';
  if(cursorImg) cursorImg.remove();
};

window.addEventListener('mousemove',e=>{
  targetX=e.pageX;
  targetY=e.pageY;
});

function followCursor(){
  currentX += (targetX - currentX) * 0.05;
  currentY += (targetY - currentY) * 0.05;
  cursorEl.style.left = currentX + 'px';
  cursorEl.style.top = currentY + 'px';
  requestAnimationFrame(followCursor);
}
followCursor();
// --- סוף קוד הסמן ---

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function showToast(t,m=1800){const e=document.getElementById('toast');e.innerText=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>{e.style.display='none'},m)}
function beep(){try{const a=new(AudioContext||webkitAudioContext)();const o=a.createOscillator();o.type='square';o.frequency.value=rand(200,1200);o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},150)}catch(e){}}
function maybeThrowRefError(){ if(Math.random()<0.08){ try{ nonExistentFunctionCall(); }catch(e){ console.error('caught ref error',e); } } }
function annoyingAction(){const r=rand(0,3);switch(r){case 0:alert('מסך קופץ!');break;case 1:document.body.style.background=`rgb(${rand(0,255)},${rand(0,255)},${rand(0,255)})`;break;case 2:showToast('תקלה מוזרה!');break;case 3:document.title='המשחק הכי גרוע בעולם באמת';break;}}
function randomAnnoy(){const chance=Math.floor(Math.random()*20);if(chance===0){beep();alert('צפצוף אקראי!');return;}clickCount++;if(clickCount%2===1){beep();}else{annoyingAction();}}
function spawnPet(){const p={x:rand(10,460),y:rand(10,300),w:rand(10,40),h:rand(10,40),color:`rgb(${rand(0,255)},${rand(0,255)},${rand(0,255)})`};pets.push(p);updateUI();}
function sellPet(){if(pets.length===0){showToast('אין חיות למכור');return;} if(Math.random()<0.04){ pets=null; console.warn('pets=null'); return;} const i=rand(0,pets.length-1);pets.splice(i,1);coins+=rand(1,10);updateUI();}
function draw(){tick++; if(Math.random()<0.05){try{ctx2.fillStyle='red';ctx2.fillRect(0,0,10,10);}catch(e){}} ctx.clearRect(0,0,canvas.width,canvas.height);
 for(const p of (pets||[])){ if(Math.random()<0.02){p.x+=rand(-300,300);p.y+=rand(-300,300);} ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.w,p.h);}
 ctx.fillStyle='#ff0';ctx.fillText('מטבעות:'+coins,10,20);
 ctx.fillStyle='#0f0';ctx.fillText('חיות:'+(pets?pets.length:'?'),10,40);
 maybeThrowRefError();
}
function updateUI(){ try{ document.getElementById('ann').innerText=`מטבעות: ${coins} • חיות: ${pets?pets.length:'?'} `; if(!pets || pets.length===0) document.getElementById('sellbtn').setAttribute('disabled',''); else document.getElementById('sellbtn').removeAttribute('disabled'); }catch(e){} }

document.getElementById('spawnbtn').onclick=spawnPet;
document.getElementById('sellbtn').onclick=sellPet;
document.getElementById('trashbtn').onclick=randomAnnoy;

let intervalMs=150;if(Math.random()<0.05)intervalMs=-100;
setInterval(()=>{try{draw();updateUI();}catch(e){}},Math.abs(intervalMs));

function randomCursorFlash(){let t=rand(10000,30000);setTimeout(()=>{document.body.style.cursor='default';setTimeout(()=>{document.body.style.cursor='none';randomCursorFlash();},500);},t);}
randomCursorFlash();

function randomResizeFrame(){let w=rand(500,800);let h=rand(400,600);gameWrap.style.width=w+'px';gameWrap.style.height=h+'px';setTimeout(randomResizeFrame,rand(2000,5000));}
randomResizeFrame();

function randomResizeGame(){if(Math.random()<0.06){canvas.style.transform='scale(bad)';} const s=1+(Math.random()*0.5-0.25);canvas.style.transform=`scale(${s}) rotate(${rand(-5,5)}deg)`;setTimeout(randomResizeGame,rand(2500,5500));}
randomResizeGame();

setInterval(()=>{try{if(pets&&Array.isArray(pets)){pets.forEach(p=>{if(Math.random()<0.12){if(Math.random()<0.5){p.x=-9999;p.y=-9999;}else{p.x=Math.random()*canvas.width*2-canvas.width/2;p.y=Math.random()*canvas.height*2-canvas.height/2;}}});}}catch(e){}},700);

function occasionalBlock(){if(Math.random()<0.02){const end=Date.now()+500;while(Date.now()<end){};}setTimeout(occasionalBlock,1000);}
occasionalBlock();

setInterval(()=>{document.querySelectorAll('.btn').forEach(b=>{if(Math.random()<0.05){b.style.width=rand(0,999)+'px';b.style.height=rand(0,300)+'px';}});},1200);

setInterval(()=>{const ann=document.getElementById('ann');if(Math.random()<0.05){ann.style.color=`rgb(${rand(-500,700)},${rand(-500,700)},${rand(-500,700)})`;}},900);

setInterval(()=>{if(Math.random()<0.04){const d=document.createElement('div');d.innerText='שגיאה: '+rand(1000,9999);d.style.position='fixed';d.style.left=rand(0,100)+'vw';d.style.top=rand(0,100)+'vh';d.style.color='red';d.style.fontSize='20px';d.style.zIndex=99999;document.body.appendChild(d);setTimeout(()=>d.remove(),rand(800,3000));}},700);

setInterval(()=>{if(Math.random()<0.04){gameWrap.style.transform=`scale(${Math.random()*3}) rotate(${rand(-180,180)}deg)`;}},2000);

setInterval(()=>{if(pets&&Math.random()<0.03){pets.forEach(p=>{p.w=rand(-200,200);p.h=rand(-200,200);});}},1500);

// teleport bug for html elements
setInterval(()=>{
  document.querySelectorAll('.game-object').forEach(obj=>{
    if(Math.random()<0.05){
      obj.style.opacity='0';
      setTimeout(()=>{
        obj.style.left=Math.random()*90+'%';
        obj.style.top=Math.random()*90+'%';
        obj.style.opacity='1';
      },400+Math.random()*1200);
    }
  });
},600);
</script>
</body>
</html>
